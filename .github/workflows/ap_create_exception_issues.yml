name: Create AP Exception Issues

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create exception issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ap_create_exception_issues.py
